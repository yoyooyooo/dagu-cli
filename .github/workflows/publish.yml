name: Publish

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Use npm 11 for trusted publishing
        run: npm install -g npm@11.15.0
      - run: bun install --frozen-lockfile
      - name: Validate tag
        run: |
          node <<'NODE'
          const { name, version } = require("./package.json");
          const tag = process.env.GITHUB_REF_NAME;
          if (name !== "dagu-cli") {
            console.error(`unexpected package name ${name}`);
            process.exit(1);
          }
          if (tag !== `v${version}`) {
            console.error(`tag ${tag} does not match v${version}`);
            process.exit(1);
          }
          const file = process.env.GITHUB_ENV;
          require("node:fs").appendFileSync(file, `PACKAGE_VERSION=${version}\nRELEASE_TAG=${tag}\n`);
          NODE
      - run: bun run check
      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          bun pm pack --destination "$RUNNER_TEMP/pack"
          tarball="$RUNNER_TEMP/pack/dagu-cli-${PACKAGE_VERSION}.tgz"
          tar -xOf "$tarball" package/package.json | node -e '
            let text = "";
            process.stdin.on("data", (chunk) => { text += chunk; });
            process.stdin.on("end", () => {
              const manifest = JSON.parse(text);
              if (JSON.stringify(manifest).includes("catalog:")) process.exit(1);
              if (manifest.name !== "dagu-cli" || manifest.version !== process.env.PACKAGE_VERSION) process.exit(1);
            });
          '
          echo "TARBALL=$tarball" >> "$GITHUB_ENV"
      - name: Publish
        run: |
          unset NODE_AUTH_TOKEN
          if npm view "dagu-cli@${PACKAGE_VERSION}" version --registry https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "dagu-cli@${PACKAGE_VERSION} is already on npm; skipping publish."
            exit 0
          fi
          npm publish "$TARBALL" --access public --provenance --registry https://registry.npmjs.org/
      # Registry lag is common after publish; lengthen retries rather than skipping success.
      - name: Verify npm package
        run: |
          for attempt in $(seq 1 12); do
            published="$(npm view "dagu-cli@${PACKAGE_VERSION}" version --registry https://registry.npmjs.org/ 2>/tmp/npm-view.err || true)"
            if [ "$published" = "$PACKAGE_VERSION" ]; then
              echo "verified dagu-cli@${PACKAGE_VERSION} (attempt ${attempt})"
              exit 0
            fi
            if [ "$attempt" = "12" ]; then
              cat /tmp/npm-view.err >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --notes "dagu-cli ${PACKAGE_VERSION}"
          else
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes "dagu-cli ${PACKAGE_VERSION}" --verify-tag
          fi
      # Join the tailnet ephemerally, then start automation global-pkg-upgrade.
      # Secrets: shared TS_OAUTH_CLIENT_ID / TS_OAUTH_SECRET, DAGU_API_KEY.
      # DAGU_BASE_URL defaults to the fleet HTTPS origin from agent-kit env.fleet.sh.
      - name: Join Tailscale
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Verify CI network identity
        shell: bash
        run: |
          set -euo pipefail
          tailscale status --json | python3 -c 'import json,sys; s=json.load(sys.stdin); assert s.get("BackendState")=="Running" and s.get("Self",{}).get("Online") is True and s.get("Self",{}).get("Tags")==["tag:ci"], "CI Tailscale identity unavailable"'
          curl --fail --silent --show-error --max-time 20 https://dagu-mini.tail9146e0.ts.net/health >/dev/null
      - name: Start global-pkg-upgrade
        env:
          DAGU_BASE_URL: https://dagu-mini.tail9146e0.ts.net
          DAGU_API_KEY: ${{ secrets.DAGU_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${DAGU_API_KEY:-}" ]; then
            echo "DAGU_API_KEY secret is required to start global-pkg-upgrade" >&2
            exit 1
          fi
          # Stable release identity survives lost acknowledgements and workflow reruns.
          python3 scripts/start-global-pkg-upgrade.py
